# Verified locally before enabling (see docs/CI_PERFORMANCE.md's Gradle caching section) - both
# genuinely help, on top of setup-java's cache: gradle (which already caches ~/.gradle/caches,
# including the build cache's own build-cache-1 subdirectory - same parent, no extra CI wiring
# needed) and the dependency artifacts it downloads.
#
# org.gradle.caching: task output caching. compileJava/compileTestJava/test/jacocoTestReport are all
# genuinely cacheable, and Gradle's ABI-aware "compile avoidance" means compileTestJava/test can still
# hit cache even when a main source file changes, as long as the change doesn't affect any public
# API surface (e.g. a comment, a private method body, a log statement) - the common case for most
# ordinary commits. generateJooq does NOT benefit - the nu.studer.jooq plugin's task hardcodes
# `Task.upToDateWhen is false` (confirmed via --info), so it always re-runs regardless of this
# setting. Measured locally: ~35s (build cache cold) -> ~8s (no source changes) / ~12s (one main
# source file changed, comment-only) for `test jacocoTestReport`.
#
# org.gradle.configuration-cache: separate mechanism, skips re-evaluating build.gradle itself on a
# cache hit. Smaller but real on top of the above (~8s -> ~6s locally) - Gradle's own CLI already
# nags to enable this on every run.
org.gradle.caching=true
org.gradle.configuration-cache=true
