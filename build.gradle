plugins {
    id 'java'
    id 'jacoco'
    id 'nu.studer.jooq' version '10.2.1'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'io.github.ben-manes.versions' version '0.61.0'
}

group = 'com.bonney'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

ext {
    feignVersion = '13.14'
    mockitoVersion = '5.23.0'
    junitVersion = '6.1.3'
    jooqVersion = '3.21.7'
}

dependencies {
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2'
    implementation 'com.google.guava:guava:33.7.1-jre'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    implementation "io.github.openfeign:feign-okhttp:${feignVersion}"
    implementation "io.github.openfeign:feign-jackson:${feignVersion}"
    implementation "io.github.openfeign:feign-slf4j:${feignVersion}"
    implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
    implementation 'org.eclipse.angus:angus-mail:2.0.5'

    implementation "org.jooq:jooq:${jooqVersion}"
    // jOOQ's own org.jooq.conf.Settings/RenderQuotedNames (used directly in HobbsApplication) carry
    // JAXB annotations in their compiled bytecode, but jOOQ doesn't declare jakarta.xml.bind-api as a
    // dependency of its own - without it on our compile classpath, javac can't fully resolve those
    // annotations while compiling anything that references those classes, producing a harmless but
    // noisy "unknown enum constant XmlAccessType.FIELD" warning on every build. compileOnly is enough:
    // nothing at runtime actually needs JAXB, jOOQ's Settings works fine without it, this is purely to
    // give javac the classfile it wants to see at compile time.
    compileOnly 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'io.javalin.community.openapi:javalin-openapi-plugin:7.2.3'
    implementation 'io.javalin.community.openapi:javalin-swagger-plugin:7.2.3'
    annotationProcessor 'io.javalin.community.openapi:openapi-annotation-processor:7.2.3'
    implementation 'org.flywaydb:flyway-core:13.4.0'
    implementation 'org.flywaydb:flyway-database-postgresql:13.4.0'
    implementation 'com.h2database:h2:2.4.240'

    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    // Embedded fake SMTP server so SmtpEmailSender's test can assert a real message was received,
    // not just that no exception was thrown sending into the void.
    testImplementation 'com.icegreen:greenmail:2.1.13'
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"

    jooqGenerator "org.jooq:jooq-meta-extensions:${jooqVersion}"
}

jar {
    manifest {
        attributes 'Main-Class': 'com.bonney.hobbs.HobbsApplication'
    }
}

// Runnable fat jar. Uses Shadow instead of a hand-rolled jar merge because plain duplicate-exclusion
// (the old approach) silently drops one JDBC driver's META-INF/services/java.sql.Driver registration
// whenever two drivers (h2 + postgresql) are both on the classpath - mergeServiceFiles() concatenates
// them correctly instead of picking one arbitrarily. Since Shadow 9, the copy step's own
// duplicatesStrategy defaults to EXCLUDE and drops duplicates before mergeServiceFiles() ever sees
// them, silently undoing this - has to be set to INCLUDE so the transformer gets every duplicate.
shadowJar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

test {
    useJUnitPlatform()
}

// `./gradlew dependencyUpdates` reports every dependency (and the Gradle wrapper itself) that's
// behind its latest available version - major, minor, or patch. Informational only, not wired into
// `check`/`build`, since a new release landing shouldn't fail CI on its own; run it manually or read
// its CI summary and open an upgrade PR when something's worth bumping.
//
// isNonStable() rejects pre-release candidates (alphas/betas/RCs/milestones) so a library's own
// pre-release noise doesn't get flagged as "newer" against our deliberately-pinned stable version -
// but only when the *current* pinned version is itself stable. Guava's releases are permanently
// suffixed (e.g. "33.7.1-jre"), so without that carve-out every guava candidate would read as
// unstable and newer guava versions would never be reported. Recommended snippet from the plugin's
// own README (see "Filtering unstable versions").
def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r|-jre|-android)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named('dependencyUpdates').configure {
    checkConstraints = true
    rejectVersionIf {
        (isNonStable(candidate.version) && !isNonStable(currentVersion)) || !satisfiesDeclaredBound
    }
    // "plain" (the default) stays for the human-readable artifact CI uploads; "json" is parsed by a
    // CI step to render the result as a markdown table in the job summary, instead of something you
    // have to download an artifact to read.
    outputFormatter = 'plain,json'
}

// `checkConstraints` above means a genuine "we're deliberately not upgrading this yet" case (a
// breaking change we haven't migrated to, a transitive conflict, etc.) can be recorded as a
// constraint here instead of just silently letting the report nag forever - it drops out of
// dependencyUpdates' "later milestone versions" list, and the `because` reason is preserved and
// visible via `./gradlew dependencyInsight --dependency <name>`. Not used anywhere in this project
// today; example shape if/when it's needed:
//
// constraints {
//     implementation('org.example:some-library') {
//         version { reject('(4.2.0,)') }
//         because 'v4.3.0 removes the deprecated Foo API we still depend on - revisit after JIRA-1234'
//     }
// }

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    reports {
        csv.required = true
    }
    // Generated jOOQ code (tables/records) is exercised indirectly through the repository classes
    // that use it and shouldn't be unit-tested directly - including it here just dilutes the
    // coverage number with ~46% of the codebase's instructions that no one would ever hand-test.
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['com/bonney/hobbs/jooq/**'])
        }))
    }
}

jooq {
    version = "${jooqVersion}"
    edition = nu.studer.gradle.jooq.JooqEdition.OSS

    configurations {
        main {
            generationTool {
                logging = org.jooq.meta.jaxb.Logging.WARN
                generator {
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key = 'scripts'
                                value = 'src/main/resources/db/migration'
                            }
                            property {
                                key = 'sort'
                                value = 'flyway'
                            }
                        }
                    }
                    target {
                        packageName = 'com.bonney.hobbs.jooq'
                        directory = 'build/generated-sources/jooq'
                    }
                }
            }
        }
    }
}
