name: Java CI with Gradle

on:
  push:

permissions:
  contents: write
  checks: write

jobs:
  # Always runs (no trigger-level path filter) - deliberately, so this workflow always reports a
  # status. A trigger-level paths-ignore looked equivalent but isn't: if the whole workflow never
  # triggers, no check ever gets posted for this commit, which - on a repo with a required status
  # check (this repo has one, same as hobbs-ui - see CLAUDE.md's Working Practices and
  # docs/CI_PERFORMANCE.md) - leaves that required check stuck "waiting to be reported" forever and
  # blocks merging. A *job* that's conditionally skipped via `if:`, by contrast, still reports a
  # "skipped" status, which GitHub counts as passing for a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Hand-rolled rather than dorny/paths-filter's predicate-quantifier: every, after that option
      # turned out not to mean what it looked like it meant - it checks "does every declared PATTERN
      # have at least one matching file", not "does every changed FILE match a pattern". A single doc
      # file satisfies both '**/*.md' and 'docs/**' on its own, so a commit changing
      # gradle.properties (real config) alongside one doc file got wrongly classified docs-only and
      # had its build silently skipped - confirmed via a real merge, see docs/CI_PERFORMANCE.md. This
      # loop checks every changed file individually against the docs patterns instead, verified
      # locally across docs-only/mixed/code-only/nested-docs-path/false-positive-filename cases
      # before shipping.
      - id: check
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*) ;;
              *) docs_only=false ;;
            esac
          done < <(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: ./gradlew test jacocoTestReport

      # Informational only - never fails the build (see build.gradle's dependencyUpdates config for
      # why). Runs on every push, PRs included - a reviewer benefits from seeing what's outdated
      # just as much as anyone looking at master, and it's cheap (a few seconds).
      - name: Check dependency freshness
        run: ./gradlew dependencyUpdates

      - name: Upload dependency freshness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates-report
          path: build/dependencyUpdates/report.txt

      # Renders the same result the artifact above holds, but inline in the run's summary page -
      # nobody has to download and open a file just to see what's outdated. Parses the JSON report
      # (build.gradle's outputFormatter = 'plain,json') rather than the plain-text one, which isn't
      # structured enough to turn into a table without fragile line-scraping.
      - name: Add dependency freshness to job summary
        if: always()
        run: |
          {
            echo "## Dependency Freshness"
            count=$(jq '.outdated.count' build/dependencyUpdates/report.json)
            if [ "$count" -eq 0 ]; then
              echo "All dependencies are on their latest stable version. :white_check_mark:"
            else
              plural=$([ "$count" = 1 ] && echo "dependency is" || echo "dependencies are")
              echo "$count $plural behind their latest stable version:"
              echo
              echo "| Dependency | Current | Latest |"
              echo "| --- | --- | --- |"
              jq -r '.outdated.dependencies[] | "| \(.group):\(.name) | \(.version) | \(.available.release // .available.milestone // .available.integration) |"' build/dependencyUpdates/report.json
            fi
            gradleUpdate=$(jq -r '.gradle.current.isUpdateAvailable' build/dependencyUpdates/report.json)
            if [ "$gradleUpdate" = "true" ]; then
              running=$(jq -r '.gradle.running.version' build/dependencyUpdates/report.json)
              latest=$(jq -r '.gradle.current.version' build/dependencyUpdates/report.json)
              echo
              echo "Gradle wrapper: \`$running\` → \`$latest\` available."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Written ourselves rather than via the action's own job_summary_text input - that input goes
      # through @actions/core's summary.addRaw() with no guaranteed newline before the table markup
      # that follows it, so "##" doesn't reliably parse as a real markdown heading and ends up a
      # different (wrong) weight next to the Dependency Freshness heading above it. Writing it exactly
      # the same way as that heading guarantees they render identically.
      - name: Add Test Results heading to job summary
        if: always()
        run: echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: build/test-results/test/**/*.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/master'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv

      # Retries with a rebase+push loop because two merges landing on master close together race
      # here: both jobs check out the same base commit, so whichever finishes second gets a plain
      # `git push` rejected as non-fast-forward once the first job's badge commit has landed. This
      # step is also `continue-on-error` - a stale badge is cosmetic and must never block `deploy`
      # (which `needs: build`), a real incident that happened when PR #78's merge lost this race.
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          if [[ $(git status --porcelain .github/badges) ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/badges
            git commit -m "Update coverage badge [skip ci]"
            for i in 1 2 3; do
              git push && break
              git fetch origin master
              git rebase origin/master
            done
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Needed for cache-from/cache-to: type=gha below - that cache backend requires the
      # docker-container Buildx driver, not the default docker driver build-push-action falls back
      # to when no builder has been set up.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker-compose.yml and Caddyfile live on the VPS too (Compose/Caddy read them locally, not
      # from the image), so they need to be kept in sync on every deploy, not just the image itself -
      # otherwise a change to either silently never takes effect in production.
      #
      # The image is private, but the deploy always goes through this job, so there's no need for a
      # long-lived pull credential on the VPS - it authenticates with this job's own short-lived
      # GITHUB_TOKEN over SSH, then logs out immediately after.
      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new)
          scp "${SSH_OPTS[@]}" docker-compose.yml root@213.171.213.90:/opt/hobbs/
          # docker-compose.yml bind-mounts docker/postgres-ssl-entrypoint.sh into the postgres
          # container - that folder has to land on the VPS too, or Compose silently creates an empty
          # directory at the missing bind-mount source and postgres crash-loops trying to exec it.
          scp -r "${SSH_OPTS[@]}" docker root@213.171.213.90:/opt/hobbs/
          # shellcheck disable=SC2029  # deliberate: expand locally, the remote host has no GHCR_TOKEN/GHCR_USER of its own
          #
          # Caddy now lives in its own compose stack in the hobbs-ui repo (moved out to stop frontend-
          # serving changes needing a full backend build/deploy) - nothing to reload here any more.
          #
          # Migrations run as their own explicit step against the new image, before the long-running
          # app container is recreated - not implicitly on every boot. `docker compose run --rm` uses
          # a one-off container (removed after) with the same image/env as the real service, so a
          # pending migration is applied and reviewable as its own deploy step, deliberately sequenced
          # ahead of the code that depends on it, rather than landing silently at whatever moment the
          # app happens to restart.
          ssh "${SSH_OPTS[@]}" root@213.171.213.90 \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && cd /opt/hobbs && docker compose pull app && docker compose run --rm app migrate && docker compose up -d app && docker logout ghcr.io"
