# Run test classes concurrently - safe because every class already builds its own isolated fixture
# in @BeforeEach/@BeforeAll (a fresh in-memory H2 database with a random name, HobbsApplicationIntegrationTest's
# Javalin server on an ephemeral port (0)) rather than sharing state, per CLAUDE.md's testing notes.
# Methods within the same class stay sequential (same_thread) - the conservative default, since at
# least one class (SmtpEmailSenderTest) shares a single fixture (a GreenMail SMTP server) across its
# @Test methods via @BeforeAll rather than @BeforeEach.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1
