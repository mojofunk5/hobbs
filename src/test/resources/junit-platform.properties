# Run both test classes AND methods within a class concurrently by default - every test class in
# this suite builds its own isolated fixture in @BeforeEach (a fresh in-memory H2 database with a
# random name; HobbsApplicationIntegrationTest's Javalin server on an ephemeral port (0)) using
# JUnit's default per-method test instance lifecycle, so its ~60 methods are just as independent of
# each other as separate classes are - see CLAUDE.md's testing notes. An earlier, more conservative
# version of this file defaulted methods to same_thread, which left that one class (almost certainly
# the largest share of total suite runtime) fully serial regardless of core count - the opposite of
# where the parallelism actually mattered.
#
# SmtpEmailSenderTest is the sole exception - it shares one GreenMail SMTP server across its @Test
# methods via static fields set in @BeforeAll rather than @BeforeEach, so its methods aren't
# independent. Opted out explicitly with @Execution(SAME_THREAD) on that class rather than lowering
# this default, since grepping the suite (`grep -rln "private static [A-Z]" src/test`) confirms it's
# the only class with any shared state across its own methods.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1
